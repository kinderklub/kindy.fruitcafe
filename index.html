<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fruit Café</title>
  
  <!-- Quicksand Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      font-family: 'Quicksand', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #fff0f5 0%, #e6f7ff 50%, #fff9e6 100%);
      overflow: hidden;
      touch-action: manipulation;
    }

    @keyframes bounce-gentle {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @keyframes float-slow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(2deg); }
    }

    @keyframes shake-gentle {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    @keyframes spin-blend {
      0% { transform: rotate(0deg) scale(1); }
      25% { transform: rotate(-8deg) scale(1.05); }
      50% { transform: rotate(8deg) scale(1.08); }
      75% { transform: rotate(-8deg) scale(1.05); }
      100% { transform: rotate(0deg) scale(1); }
    }

    .anim-bounce { animation: bounce-gentle 2s infinite ease-in-out; }
    .anim-float { animation: float-slow 3.5s infinite ease-in-out; }
    .anim-shake { animation: shake-gentle 0.4s ease-in-out; }
    .anim-blend { animation: spin-blend 0.25s infinite linear; }

    .btn-kawaii {
      transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 6px 0 rgba(0,0,0,0.12), 0 10px 15px rgba(0,0,0,0.08);
    }
    
    .btn-kawaii:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 rgba(0,0,0,0.12), 0 3px 6px rgba(0,0,0,0.08);
    }

    .card-kawaii {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border: 4px solid #FFF0F5;
      box-shadow: 0 12px 24px rgba(255, 182, 193, 0.25), inset 0 2px 4px rgba(255,255,255,0.9);
      border-radius: 2rem;
    }

    .fruit-btn {
      touch-action: none;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.15s ease;
    }
    
    .fruit-btn:active {
      transform: scale(1.15);
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #FFF0F5; border-radius: 10px; }
    ::-webkit-scrollbar-thumb { background: #FFB6C1; border-radius: 10px; }
  </style>
</head>

  <!-- TOP HEADER BAR -->
  <header class="w-full max-w-4xl px-4 py-2.5 flex justify-between items-center z-20">
    <button onclick="app.openProfileModal()" class="bg-white/95 border-2 border-pink-300 rounded-full px-3.5 py-1.5 flex items-center space-x-2 shadow-sm hover:bg-pink-50 active:scale-95 transition relative">
      <div id="header-avatar" class="w-6 h-6 flex-shrink-0"></div>
      <div class="text-left">
        <div id="display-player-name" class="text-xs font-extrabold text-pink-600 leading-tight">Pilih Profil</div>
        <div id="display-family-code" class="text-[10px] text-gray-500 font-bold leading-tight">#---</div>
      </div>
      <span class="absolute -top-1 -right-1 flex h-3 w-3">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-pink-400 opacity-75"></span>
        <span class="relative inline-flex rounded-full h-3 w-3 bg-pink-500"></span>
      </span>
    </button>

    <div class="flex items-center space-x-2">
      <div class="bg-amber-100 border-2 border-amber-300 rounded-full px-3 py-1 flex items-center space-x-1.5 shadow-sm">
        <div id="header-star-icon" class="w-4 h-4 flex-shrink-0"></div>
        <span id="global-stars" class="font-extrabold text-amber-700 text-xs">0</span>
      </div>
      <div class="bg-yellow-100 border-2 border-yellow-300 rounded-full px-3 py-1 flex items-center space-x-1.5 shadow-sm">
        <div id="header-coin-icon" class="w-4 h-4 flex-shrink-0"></div>
        <span id="global-coins" class="font-extrabold text-yellow-800 text-xs">0</span>
      </div>

      <button id="btn-sound" onclick="app.toggleSound()" class="w-9 h-9 bg-white border-2 border-purple-300 rounded-full flex items-center justify-center p-2 shadow-sm hover:bg-purple-50 active:scale-90 transition"></button>

      <button onclick="app.toggleLanguage()" class="bg-white border-2 border-pink-400 rounded-full px-3 py-1 text-xs font-extrabold text-pink-600 shadow-sm hover:bg-pink-50 active:scale-90 transition flex items-center space-x-1.5">
        <div id="header-globe-icon" class="w-3.5 h-3.5"></div>
        <span id="lang-toggle-text">BM</span>
      </button>
    </div>
  </header>

  <main id="main-stage" class="w-full max-w-4xl flex-1 flex flex-col justify-center items-center px-4 relative z-10 overflow-hidden"></main>

  <!-- FOOTER -->
  <footer id="game-footer" class="w-full text-center py-2 text-xs font-bold text-pink-400 z-20 pointer-events-none">
    Kinder Klub | All Rights Reserved
  </footer>

    class SoundManager {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }
      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
      }
      playTap() {
        if (!this.enabled) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.08);
      }
      playBlend() {
        if (!this.enabled) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(150, this.ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(320, this.ctx.currentTime + 0.4);
        gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.5);
      }
      playSuccess() {
        if (!this.enabled) return;
        this.init();
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.2, this.ctx.currentTime + idx * 0.1);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + idx * 0.1 + 0.25);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(this.ctx.currentTime + idx * 0.1);
          osc.stop(this.ctx.currentTime + idx * 0.1 + 0.25);
        });
      }
      playWrong() {
        if (!this.enabled) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, this.ctx.currentTime);
        osc.frequency.setValueAtTime(180, this.ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.3);
      }
    }

      loadInitialProfile() {
        try {
          const lastKey = localStorage.getItem('fruit_cafe_active_key') || 'guest_default';
          this.loadUserProfile(lastKey);
        } catch (e) {
          console.log("Local load ready");
        }
      }

      hasValidProfile() {
        return Boolean(this.player.name && this.player.name.trim() && this.player.familyCode && this.player.familyCode.trim());
      }

      getProfileKey() {
        const cleanName = (this.player.name || '').trim().toLowerCase().replace(/[^a-z0-9]/g, '');
        const cleanCode = (this.player.familyCode || '').trim().toLowerCase().replace(/[^a-z0-9]/g, '');
        if (!cleanName || !cleanCode) return 'guest_default';
        return `${cleanName}_${cleanCode}`;
      }

      loadUserProfile(profileKey) {
        if (!profileKey) return;
        try {
          const raw = localStorage.getItem(this.storagePrefix + profileKey);
          if (raw) {
            const data = JSON.parse(raw);
            this.player = {
              name: data.name || this.player.name,
              familyCode: data.familyCode || this.player.familyCode,
              stars: data.stars ?? 0,
              coins: data.coins ?? 0,
              ordersServed: data.ordersServed ?? 0,
              fruitCollection: Array.isArray(data.fruitCollection) ? data.fruitCollection : ['raspberry', 'apple', 'banana'],
              customerCollection: Array.isArray(data.customerCollection) ? data.customerCollection : ['cat', 'bunny'],
              decorations: Array.isArray(data.decorations) ? data.decorations : ['balloon'],
              lastDailyGift: data.lastDailyGift || ''
            };
          } else {
            this.saveUserData();
          }
          this.updateHeaderUI();
          this.renderCurrentScreen();
        } catch (err) {
          console.error("Profile load fail:", err);
        }
      }

      saveUserData() {
        this.updateHeaderUI();
        const profileKey = this.getProfileKey();
        try {
          localStorage.setItem('fruit_cafe_active_key', profileKey);
          localStorage.setItem(this.storagePrefix + profileKey, JSON.stringify(this.player));
        } catch (err) {
          console.error("Save fail:", err);
        }
      }

      t(key, params = {}) {
        const keys = key.split('.');
        let val = TRANSLATIONS[this.lang];
        for (const k of keys) {
          if (val && val[k]) val = val[k];
          else return key;
        }
        if (typeof val === 'string') {
          for (const [p, pVal] of Object.entries(params)) {
            val = val.replace(`{{${p}}}`, pVal);
          }
        }
        return val;
      }

        const categories = ['picking', 'cup', 'bowl', 'juice'];
        let category = categories[Math.floor(Math.random() * categories.length)];
        let customer = CUSTOMERS[Math.floor(Math.random() * CUSTOMERS.length)];
        let targetFruit = FRUITS[Math.floor(Math.random() * FRUITS.length)];
        let count = Math.floor(Math.random() * 3) + 1;

        let secondaryFruit = null;
        if (category === 'bowl') {
          const options = FRUITS.filter(f => f.id !== targetFruit.id);
          secondaryFruit = options[Math.floor(Math.random() * options.length)];
        }

        return {
          category,
          customer,
          targetFruit,
          secondaryFruit,
          count
        };

      handleFruitTap(fruitId) {
        sound.playTap();
        this.session.workItems.push(fruitId);
        
        const workArea = document.getElementById('work-area');
        if (workArea) {
          workArea.innerHTML = this.renderWorkContainerArea(this.session.currentOrder);
        }
      }

      handleServeOrder() {
        const order = this.session.currentOrder;
        const items = this.session.workItems;

        let isCorrect = false;
        if (order.category === 'picking' || order.category === 'cup') {
          const matchCount = items.filter(id => id === order.targetFruit.id).length;
          isCorrect = matchCount === order.count;
        } else if (order.category === 'bowl') {
          isCorrect = items.includes(order.targetFruit.id) && items.includes(order.secondaryFruit.id);
        } else if (order.category === 'juice') {
          isCorrect = items.includes(order.targetFruit.id);
        }

        if (isCorrect) {
          sound.playSuccess();
          confetti({ particleCount: 45, spread: 65, origin: { y: 0.7 } });
          
          this.player.stars += 1;
          this.player.coins += 5;
          this.player.ordersServed += 1;
          this.session.servedCount += 1;
          this.session.earnedStars += 1;
          this.session.earnedCoins += 5;

          this.saveUserData();

          if (this.session.servedCount >= this.session.totalOrders) {
            this.renderSessionCompleteScreen();
          } else {
            this.session.currentOrderIndex += 1;
            this.session.currentOrder = this.generateOrder();
            this.session.workItems = [];
            this.renderGamePlayScreen();
          }
        } else {
          sound.playWrong();
          const btnServe = document.getElementById('btn-serve');
          if (btnServe) {
            btnServe.classList.add('anim-shake');
            setTimeout(() => btnServe.classList.remove('anim-shake'), 400);
          }
          this.showToast(this.t('tryAgain'));
          this.session.workItems = [];
          const workArea = document.getElementById('work-area');
          if (workArea) {
            workArea.innerHTML = this.renderWorkContainerArea(this.session.currentOrder);
          }
        }
      }

      showToast(msg) {
        const stage = document.getElementById('main-stage');

        const toast = document.createElement('div');
        toast.className = 'absolute top-10 bg-pink-500 text-white font-extrabold px-6 py-2 rounded-full shadow-lg z-50 text-xs anim-bounce';
        toast.innerText = msg;
        stage.appendChild(toast);
        setTimeout(() => toast.remove(), 1500);

      saveProfileModal() {
        sound.playTap();
        const nameInput = document.getElementById('input-child-name').value.trim();
        const codeInput = document.getElementById('input-family-code').value.trim();

        if (!nameInput || !codeInput) {
          this.showToast(this.lang === 'BM' ? "Sila masukkan Nama & Kod Famili!" : "Please enter Name & Family Code!");
          return;
        }

        this.player.name = nameInput;
        this.player.familyCode = codeInput;
        const newKey = this.getProfileKey();

        if (newKey) {
          try {
            const raw = localStorage.getItem(this.storagePrefix + newKey);
            if (raw) {
              const data = JSON.parse(raw);
              this.player = {
                name: data.name || nameInput,
                familyCode: data.familyCode || codeInput,
                stars: data.stars ?? 0,
                coins: data.coins ?? 0,
                ordersServed: data.ordersServed ?? 0,
                fruitCollection: Array.isArray(data.fruitCollection) ? data.fruitCollection : ['raspberry', 'apple', 'banana'],
                customerCollection: Array.isArray(data.customerCollection) ? data.customerCollection : ['cat', 'bunny'],
                decorations: Array.isArray(data.decorations) ? data.decorations : ['balloon'],
                lastDailyGift: data.lastDailyGift || ''
              };
              this.showToast(this.lang === 'BM' ? "Profil & rekod dimuatkan!" : "Profile & records loaded!");
            } else {
              this.saveUserData();
              this.showToast(this.lang === 'BM' ? "Profil baharu disimpan!" : "New profile saved!");
            }
          } catch (err) {
            console.error("Local save error:", err);
          }
        }

        this.updateHeaderUI();
        this.closeModal();
        this.renderCurrentScreen();
      }
    }

    window.onload = () => {
      window.app = new FruitCafeApp();
      window.app.updateHeaderUI();
      window.app.renderHomeScreen();
    };
  </script>
</body>
</html>
